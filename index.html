<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Ninas und Roys JGA 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --accent: #f97316;
      --accent-soft: rgba(249, 115, 22, 0.15);
      --error: #f97373;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1f2937 0, #020617 55%, #000 100%);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Intro-Overlay */
    .intro-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, #111827 0, #020617 60%, #000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      overflow: hidden;
    }

    .intro-text-wrapper {
      position: relative;
      padding: 1.5rem 2.5rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      box-shadow:
        0 0 40px rgba(249, 115, 22, 0.35),
        0 0 120px rgba(56, 189, 248, 0.25);
      border: 1px solid rgba(249, 115, 22, 2);
      overflow: hidden;
    }

    .intro-text {
      font-size: clamp(1.1rem, 2.4vw, 1.6rem);
      font-weight: 2000;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      color: #f9fafb;
      position: relative;
      z-index: 1;
      animation: slideText 4.6s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    .intro-glow {
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.35), transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(249, 115, 22, 0.45), transparent 55%);
      mix-blend-mode: screen;
      opacity: 0.9;
      pointer-events: none;
    }

    .intro-scanline {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(249, 250, 251, 0.18) 50%,
        transparent 100%
      );
      mix-blend-mode: soft-light;
      animation: scan 1.8s ease-out infinite;
      opacity: 0.7;
    }

    @keyframes slideText {
      0% {
        transform: translateX(120%);
        opacity: 0;
      }
      15% {
        transform: translateX(0%);
        opacity: 1;
      }
      70% {
        transform: translateX(-4%);
        opacity: 1;
      }
      100% {
        transform: translateX(-120%);
        opacity: 0;
      }
    }

    @keyframes scan {
      0% {
        transform: translateY(-120%);
      }
      100% {
        transform: translateY(120%);
      }
    }

    .intro-overlay.fade-out {
      animation: fadeOut 2s ease forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* Haupt-Content */
    .container {
      width: 100%;
      max-width: 420px;
      padding: 1.5rem;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 2s ease, transform 2s ease;
    }

    .container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card {
      background: rgba(15, 23, 42, 0.9);
      border-radius: 1.25rem;
      padding: 1.75rem 1.5rem 1.6rem;
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow:
        0 18px 45px rgba(15, 23, 42, 0.9),
        0 0 0 1px rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
    }

    .title {
      font-size: 1.4rem;
      font-weight: 2000;
      margin-bottom: 0.25rem;
      letter-spacing: 0.04em;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 1.4rem;
    }

    .fields {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin-bottom: 1.2rem;
    }

    label {
      font-size: 0.85rem;
      color: #e5e7eb;
      margin-bottom: 0.25rem;
      display: block;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.55rem 0.7rem;
      border-radius: 2rem;
      border: 1px solid rgba(148, 163, 184, 2);
      background: rgba(15, 23, 42, 0.9);
      color: var(--fg);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.4);
      background: rgba(15, 23, 42, 1);
    }

    .button-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-top: 0.4rem;
    }

    button {
      flex: 1;
      padding: 2rem 0.9rem;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #f97316, #fb923c);
      color: #111827;
      font-weight: 2000;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        0 10px 25px rgba(249, 115, 22, 0.45),
        0 0 0 1px rgba(15, 23, 42, 0.9);
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
      box-shadow:
        0 14px 30px rgba(249, 115, 22, 0.55),
        0 0 0 1px rgba(15, 23, 42, 0.9);
    }

    button:active {
      transform: translateY(0);
      box-shadow:
        0 6px 16px rgba(249, 115, 22, 0.4),
        0 0 0 1px rgba(15, 23, 42, 0.9);
    }

    .hint {
      font-size: 0.8rem;
      color: #9ca3af;
      text-align: right;
      flex: 1;
      white-space: nowrap;
    }

    .message {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      min-height: 1.1em;
      color: #9ca3af;
    }

    .message.error {
      color: var(--error);
    }

    .message.success {
      color: #4ade80;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.18rem 2rem;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid rgba(249, 115, 22, 0.5);
      color: #fed7aa;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 2rem;
    }

    .badge-dot {
      width: 0.4rem;
      height: 0.4rem;
      border-radius: 999px;
      background: #f97316;
      box-shadow: 0 0 10px rgba(249, 115, 22, 0.9);
    }

    @media (max-width: 480px) {
      .card {
        padding: 1.4rem 1.1rem 1.3rem;
      }
      .title {
        font-size: 1.25rem;
      }
      .button-row {
        flex-direction: column;
        align-items: stretch;
      }
      .hint {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <!-- Intro-Animation -->
  <div class="intro-overlay" id="intro">
    <div class="intro-text-wrapper">
      <div class="intro-glow"></div>
      <div class="intro-scanline"></div>
      <div class="intro-text">
        N & R - JGA 2026 ♥
      </div>
    </div>
  </div>

  <!-- Hauptseite -->
  <main class="container" id="main">
    <div class="card">
      <div class="badge">
        <span class="badge-dot"></span>
        <span>⭐ Rätsel-Checkpoint 🦄</span>
      </div>
      <h1 class="title">Drei Lösungswörter, ein Ziel.</h1>
      <p class="subtitle">
        Tragt die drei Lösungswörter ein. Wenn alles stimmt, öffnet sich der nächste Schritt eurer Mission.
      </p>

      <form id="riddle-form">
        <div class="fields">
          <div>
            <label for="word1">Lösungswort 1</label>
            <input type="text" id="word1" autocomplete="off" />
          </div>
          <div>
            <label for="word2">Lösungswort 2</label>
            <input type="text" id="word2" autocomplete="off" />
          </div>
          <div>
            <label for="word3">Lösungswort 3</label>
            <input type="text" id="word3" autocomplete="off" />
          </div>
        </div>

        <div class="button-row">
          <button type="submit">Ab dafür!</button>
        </div>

        <div class="message" id="message"></div>
      </form>
    </div>
  </main>

  <script>
    // Intro-Animation ausblenden und Hauptinhalt einblenden
    (function () {
      const intro = document.getElementById('intro');
      const main = document.getElementById('main');
      const introText = intro.querySelector('.intro-text');

      const showMain = () => {
        intro.classList.add('fade-out');
        setTimeout(() => {
          intro.style.display = 'none';
          main.classList.add('visible');
        }, 2000);
      };

      introText.addEventListener('animationend', showMain);

      // Fallback, falls das Event aus irgendeinem Grund nicht feuert
      setTimeout(showMain, 3200);
    })();

    // Rätsel-Logik
    (function () {
      const form = document.getElementById('riddle-form');
      const word1 = document.getElementById('word1');
      const word2 = document.getElementById('word2');
      const word3 = document.getElementById('word3');
      const message = document.getElementById('message');

      const TARGET_1 = 'jga';
      const TARGET_2 = '2026';
      const TARGET_3 = 'escape';
      const REDIRECT_URL = 'https://maps.app.goo.gl/zQyr4L8mKZ6ZZ4f26';

      function normalize(value) {
        return value.trim();
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        message.classList.remove('error', 'success');

        const v1 = normalize(word1.value.toLowerCase());
        const v2 = normalize(word2.value.toLowerCase());
        const v3 = normalize(word3.value.toLowerCase());

        const correct =
          v1 === TARGET_1 &&
          v2 === TARGET_2 &&
          v3 === TARGET_3;

        if (correct) {
          message.textContent = 'Perfekt! Weiter geht’s …';
          message.classList.add('success');
          setTimeout(() => {
            window.location.href = REDIRECT_URL;
          }, 2000);
        } else {
          message.textContent = 'Noch nicht ganz. Checkt alle drei Lösungswörter noch einmal.';
          message.classList.add('error');
        }
      });
    })();
  </script>
</body>
</html>
